spring:
  config:
    activate:
      on-profile: prod

  server:
    port: ${PORT:8080}

  datasource:
    url: jdbc:postgresql://${DB_USER}${DB_PASSWORD}${DB_HOST}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_events
    username: postgres
    password: admin
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    com.meus.eventos: TRACE